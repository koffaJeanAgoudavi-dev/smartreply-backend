name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Lint the complete repository
        run: ruff check --select E,F,I .

      - name: Compile Python sources
        run: python -m compileall -q app alembic scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Alembic head
        run: alembic heads

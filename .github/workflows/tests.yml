name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Lint changed backend capability
        run: >-
          ruff check --select E,F,I
          app/modules/companies
          app/modules/telegram
          app/modules/pipeline
          app/modules/pipeline_selection
          app/modules/pipeline_execution
          app/modules/processed_emails
          app/modules/actions/company_service.py
          app/modules/drafts/service.py
          app/modules/gmail/service.py
          app/modules/notifications/service.py
          app/modules/sheets/service.py
          app/core/config.py
          app/db/sheets_client.py
          app/main.py
          alembic/env.py
          alembic/versions/4f19b1a03c2d_add_companies_table.py
          alembic/versions/c8d4e2f7a1b9_add_telegram_link_tables.py
          alembic/versions/a4f6c8d2e1b7_add_processed_emails.py
          alembic/versions/f2c4d6e8a0b1_add_company_telegram_actions.py
          scripts/setup_webhook.py
          scripts/share_company_sheets_with_service_account.py
          tests

      - name: Compile Python sources
        run: python -m compileall -q app alembic scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Alembic head
        run: alembic heads
